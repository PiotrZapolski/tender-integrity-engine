name: tie
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: tie
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: tie
    volumes: ["tie_pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tie"]
      interval: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    build: ../collector
    image: tie-collector
    env_file: .env
    command: ["tie", "migrate"]
    depends_on: { db: { condition: service_healthy } }
  # Exactly one worker replica: budget and dedup logic assume a single worker.
  # Workers are split by job kind so a slow host (e-Zamowienia, 2 s between requests)
  # never blocks parsing or other hosts. Per-host rate limits live in each process, so
  # each external host is served by exactly one worker kind.
  worker:
    build: ../collector
    image: tie-collector
    env_file: .env
    command: ["tie", "worker", "--kinds", "ezamawiajacy_docs,ezamawiajacy_download,identity,whitelist,msig_board,engine_run"]
    volumes: ["${RAW_HOST_DIR:-./data/raw}:/data/raw"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    cpus: 4
    mem_limit: 8g
    restart: unless-stopped
    # Let the current job finish on deploy instead of SIGKILL after Docker's default 10 s.
    # An identity job runs up to 10 minutes before it queues a continuation.
    stop_grace_period: 15m
  worker-ezam:
    image: tie-collector
    env_file: .env
    command: ["tie", "worker", "--kinds", "ezam_docs,ezam_download"]
    volumes: ["${RAW_HOST_DIR:-./data/raw}:/data/raw"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    cpus: 1
    mem_limit: 2g
    restart: unless-stopped
    stop_grace_period: 2m
  # BZP days get their own process so the 2021+ backfill is not queued behind thousands of
  # document downloads. Together with worker-ezam this is 2 requests/s to ezamowienia.gov.pl;
  # its WAF 403s are retried.
  worker-bzp:
    image: tie-collector
    env_file: .env
    command: ["tie", "worker", "--kinds", "bzp_day"]
    volumes: ["${RAW_HOST_DIR:-./data/raw}:/data/raw"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    cpus: 1
    mem_limit: 2g
    restart: unless-stopped
    stop_grace_period: 2m
  worker-parse:
    image: tie-collector
    env_file: .env
    command: ["tie", "worker", "--kinds", "opening_parse"]
    volumes: ["${RAW_HOST_DIR:-./data/raw}:/data/raw"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    deploy:
      replicas: 3
    cpus: 1.5
    mem_limit: 2g
    restart: unless-stopped
    stop_grace_period: 5m
  cron:
    build: ../collector
    image: tie-collector
    env_file: .env
    command: ["/usr/local/bin/supercronic", "/app/crontab"]
    depends_on: { migrate: { condition: service_completed_successfully } }
    restart: unless-stopped
    stop_grace_period: 120s
volumes:
  tie_pg:
