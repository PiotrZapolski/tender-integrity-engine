name: ci

# Szybki pas na PR = pelny zestaw z full-tests.yml. Push na master nie powtarza
# testow (przeszly na PR albo w kolejce merge).
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    uses: ./.github/workflows/full-tests.yml
